      tags:
      - Admin
  /ads:
    get:
      description: |-
        Get all ads or filter and order them using query parameters.

        Filtering operators:
        :   (equals)
        !:  (not equals)
        >   (greater than)
        >=  (greater than or equal)
        <   (less than)
        <=  (less than or equal)
        ~   (contains, case-insensitive)

        Examples:
        /ads?filter=is_active:true
        /ads?filter=program_id:1
        /ads?filter=bid_price>=1000
        /ads?order_by=bid_price&sort=desc
        /ads?order_by=created_at&order_by=bid_price&sort=desc&sort=asc
      parameters:
      - collectionFormat: csv
        description: Filter expression. Can be repeated.
        in: query
        items:
          type: string
        name: filter
        type: array
      - collectionFormat: csv
        description: Fields to order by. Can be repeated.
        in: query
        items:
          type: string
        name: order_by
        type: array
      - collectionFormat: csv
        description: Sort direction for each order_by field (asc or desc). Can be
          repeated.
        in: query
        items:
          type: string
        name: sort
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Ad'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get ads
      tags:
      - Ads
    post:
      consumes:
      - application/json
      description: Create a new ad.
      parameters:
      - description: Ad
        in: body
        name: ad
        required: true
        schema:
          $ref: '#/definitions/models.Ad'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Ad'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create ad
      tags:
      - Ads
  /ads/{id}:
    delete:
